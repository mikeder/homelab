<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>tsnet</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0d0f;
        }

        /* The Universal / "Cool S" (a.k.a. Stussy S, Superman S) — the canonical
           90s notebook-doodle construction: one 8-point polyline drawn twice,
           the second copy rotated 180 deg. Ref: Wikipedia "Cool S" (S-cool.svg). */
        .cool-s {
            height: 85vh;
            max-width: 92vw;
            filter:
                drop-shadow(0 0 2px rgba(140, 210, 255, 0.7)) drop-shadow(0 0 10px rgba(120, 190, 255, 0.5)) drop-shadow(0 0 26px rgba(255, 60, 200, 0.4));
        }
    </style>
</head>

<body>
    <svg class="cool-s" viewBox="0.3 0.3 5.4 11.4" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#f4f8fc" />
                <stop offset="0.20" stop-color="#c2d4e2" />
                <stop offset="0.40" stop-color="#5f7f9c" />
                <stop offset="0.49" stop-color="#2c485f" />
                <stop offset="0.52" stop-color="#eaf2f8" />
                <stop offset="0.66" stop-color="#93a9bb" />
                <stop offset="0.85" stop-color="#38566f" />
                <stop offset="1" stop-color="#d3e0ec" />
            </linearGradient>
        </defs>
        <g fill="none" stroke="url(#chrome)" stroke-width="0.72" stroke-linecap="round" stroke-linejoin="round">
            <path id="s-half" d="M3 9V7L1 5V3L3 1 5 3V5L4 6" />
            <use href="#s-half" transform="rotate(180 3 6)" />
        </g>
    </svg>
</body>

</html>
