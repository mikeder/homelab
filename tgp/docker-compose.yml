services:
  api:
    container_name: tinygameplatform-api
    image: mikeder/tinygameplatform:api
    depends_on:
      - db
      - migrate
    environment:
      - AUTH_KEY=${AUTH_KEY}
      - AUTH_ISSUER=${AUTH_ISSUER}
      - DB_DATABASEHOST=${DB_DATABASEHOST}
      - DB_DATABASEPASSWORD=${TGP_DB_PASSWORD:?set TGP_DB_PASSWORD in tgp/.env}
      # Browsers allowed to call the API: the server's own list (the admin site if
      # unset), plus Gridlock for cloud saves. Comma-separated.
      - SERVER_ALLOWEDORIGINS=${SERVER_ALLOWEDORIGINS:-https://tgp.sqweeb.net},https://gridlock.sqweeb.net
      - SERVER_PORT=${SERVER_PORT}
      # Traefik sets X-Real-Ip to the connecting client's address (overwriting any sent
      # by the client), so login rate limits count real players, not Traefik. Only safe
      # because the API is reachable only through Traefik (no published ports).
      - SERVER_CLIENTIPHEADER=X-Real-IP
    restart: unless-stopped
    networks:
      - proxy
    labels:
      # tell watchtower to update/restart this only after migrate
      - com.centurylinklabs.watchtower.depends-on=tinygameplatform-migrate

      # enable traefik ingress
      - traefik.enable=true

      # https web
      - traefik.http.routers.tinygameplatform-https.tls=true
      - traefik.http.routers.tinygameplatform-https.entrypoints=https
      - traefik.http.routers.tinygameplatform-https.tls.certresolver=letsencrypt
      - traefik.http.routers.tinygameplatform-https.rule=Host(`api.tgp.sqweeb.net`)
      # use h2c scheme for grpc backend
      # https://doc.traefik.io/traefik/user-guides/grpc/#conclusion
      - traefik.http.services.tinygameplatform-https.loadbalancer.server.scheme=h2c

  site:
    container_name: tinygameplatform-site
    image: mikeder/tinygameplatform:site
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - proxy
    labels:
      # enable traefik ingress
      - traefik.enable=true

      # http web
      - traefik.http.routers.tinygameplatform-site-http.entrypoints=http
      - traefik.http.routers.tinygameplatform-site-http.rule=Host(`tgp.sqweeb.net`)
      - traefik.http.routers.tinygameplatform-site-http.middlewares=redirect-https # redirect http to https

      # https web
      - traefik.http.routers.tinygameplatform-site-https.tls=true
      - traefik.http.routers.tinygameplatform-site-https.entrypoints=https
      - traefik.http.routers.tinygameplatform-site-https.tls.certresolver=letsencrypt
      - traefik.http.routers.tinygameplatform-site-https.rule=Host(`tgp.sqweeb.net`)

  db:
    container_name: tinygameplatform-db
    image: postgres:16
    restart: always
    shm_size: 128mb
    # No published ports: the api and migrate containers reach it on the proxy network.
    # (A published port would bypass the host firewall.)
    environment:
      POSTGRES_DB: tgp
      POSTGRES_USER: tgp
      # Only used when the data directory is first created; for an existing database,
      # change the password with ALTER USER (see tgp/README.md).
      POSTGRES_PASSWORD: ${TGP_DB_PASSWORD:?set TGP_DB_PASSWORD in tgp/.env}
    networks:
      - proxy
    volumes:
      - /home/meder/homelab/tgp/data:/var/lib/postgresql/data

  migrate:
    container_name: tinygameplatform-migrate
    image: mikeder/tinygameplatform:migrate
    restart: on-failure
    depends_on:
      - db
    environment:
      - DATABASEHOST=db
      - DATABASEUSER=tgp
      - DATABASEPASSWORD=${TGP_DB_PASSWORD:?set TGP_DB_PASSWORD in tgp/.env}
    networks:
      - proxy

networks:
  proxy:
    name: proxy
    external: true
