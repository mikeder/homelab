services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    environment:
      # Route53 keys for the DNS challenge (IAM user from traefik/iam-acme-policy.json).
      # Secret: lives in traefik/.env on the server. See traefik/README.md.
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in traefik/.env}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in traefik/.env}
      - AWS_REGION=us-east-1
      - AWS_HOSTED_ZONE_ID=${AWS_HOSTED_ZONE_ID:?set AWS_HOSTED_ZONE_ID in traefik/.env}
    networks:
      - proxy
    # The tvremote apps run with host networking; Traefik reaches them on the host
    # (routers tvremote-1..3 in rules.yml).
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 80:80
      - 443:443
      # Dashboard (api.insecure: no login): localhost only. Reach it over SSH with
      # ssh -L 8888:localhost:8888 <server>, then http://localhost:8888
      - 127.0.0.1:8888:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/meder/homelab/traefik/acme.json:/acme.json
      - /home/meder/homelab/traefik/traefik.yml:/traefik.yml
      - /home/meder/homelab/traefik/rules.yml:/rules.yml
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.redirect-https.redirectScheme.scheme=https
networks:
  proxy:
    external: true
