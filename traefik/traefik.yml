log:
  level: WARN

api:
  insecure: true
  dashboard: true

entryPoints:
  http:
    address: ":80"
  https:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    filename: "/rules.yml"
    watch: true

# Certificates come from Let's Encrypt's DNS challenge through Route53 (keys in
# traefik/.env, see traefik/README.md). One wildcard covers every *.sqweeb.net router
# (requested in rules.yml), so new hostnames don't show up in certificate logs and
# private services can get certs without being reachable.
certificatesResolvers:
  letsencrypt:
    acme:
      email: sqweebking@gmail.com
      storage: acme.json
      dnsChallenge:
        provider: route53
